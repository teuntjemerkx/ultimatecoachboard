name: Web app

on:
  push:
    branches-ignore: [ci-screenshots]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

jobs:
  web:
    name: Web app tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
