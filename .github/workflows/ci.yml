name: CI

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core tests (Linux, Swift 6.1)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: CoachBoardCore
        run: swift test

  app-ios:
    name: Core tests and iPad app build (macOS, Xcode 26)
    runs-on: macos-26
    permissions:
      contents: write      # publishes Simulator screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen xcbeautify
      # xcbeautify's GitHub renderer turns compiler errors and test failures into annotations on the run.
      - name: swift test
        working-directory: CoachBoardCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../core-test.log | xcbeautify --renderer github-actions
      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ipads = [x for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPad")]
          pick = [x for x in ipads if "13-inch" in x["name"]] or ipads
          print(pick[-1]["udid"] if pick else "")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for the iOS Simulator
        working-directory: App
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          if [ -n "$UDID" ]; then DEST="id=$UDID"; else DEST="generic/platform=iOS Simulator"; fi
          xcodebuild -project UltimateCoachBoard.xcodeproj -scheme UltimateCoachBoard \
            -destination "$DEST" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../app-build.log | xcbeautify --renderer github-actions
      - name: Report raw errors
        if: failure()
        run: |
          cat core-test.log app-build.log 2>/dev/null \
            | grep -E 'error:|error: |ld: |Undefined symbol|failed' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done
      - name: Screenshots in demo mode
        if: steps.sim.outputs.udid != ''
        timeout-minutes: 30
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # Every simctl call gets a time limit, so one hung screen cannot stall the job.
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          xcrun simctl boot "$UDID" || true
          limit 240 xcrun simctl bootstatus "$UDID" -b || true
          APP=$(find App/build/Build/Products -maxdepth 2 -name 'UltimateCoachBoard.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # The first launch after boot can take minutes while the Simulator finishes setting up; warm it up once.
          limit 240 xcrun simctl launch "$UDID" app.ultimatecoachboard.ipad || echo "warm-up launch failed or timed out" >> shots/ci-log.txt
          sleep 5
          # shot <file> <screen> [extra launch arguments]
          shot() {
            local name=$1 screen=$2; shift 2
            local launched=no
            for attempt in 1 2; do
              if limit 90 xcrun simctl launch --terminate-running-process "$UDID" app.ultimatecoachboard.ipad -demoScreen "$screen" "$@"; then
                launched=yes; break
              fi
              echo "$name: launch attempt $attempt failed or timed out" >> shots/ci-log.txt
            done
            if [ "$launched" = yes ]; then
              sleep 10
              limit 30 xcrun simctl io "$UDID" screenshot "shots/$name.png" || echo "$name: screenshot timed out" >> shots/ci-log.txt
            fi
          }
          # Every screen in the default (recommended) template, then Live and 3D Studio in each other template.
          for s in launcher setup live advanced setbreak log studio studio3d pov rally rallyeye videomark videowatch video3d videoeye gallery; do shot "$s" "$s"; done
          for s in launcher live studio rally; do shot "advanced_${s}" "$s" -advanced; done
          for t in night broadcast whiteboard neon; do
            for s in launcher live studio3d; do shot "${t}_${s}" "$s" -theme "$t"; done
          done
          DATA=$(limit 30 xcrun simctl get_app_container "$UDID" app.ultimatecoachboard.ipad data || true)
          cp "$DATA/Documents/demo-diagnostics.txt" shots/diagnostics.txt 2>/dev/null || echo "no diagnostics" > shots/diagnostics.txt
          ls -la shots
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && steps.sim.outputs.udid != '' && github.ref == 'refs/heads/main'
        working-directory: shots
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Simulator screenshots of ${GITHUB_SHA} (demo mode; overwritten on every push to main)." > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
